name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Plugin — typecheck + build
        run: |
          cd plugin
          npm ci
          npm run typecheck
          npm run build

      - name: Server — typecheck + build
        run: |
          cd server
          npm ci
          npm run typecheck
          npm run build
